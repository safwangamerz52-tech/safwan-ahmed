<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUGX - Best Gaming Site Ever</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero-section">
        <!-- Background Lighting & Stars Overlay -->
        <div class="light-glow glow-top-left"></div>
        <div class="light-glow glow-center"></div>
        <div class="stars-overlay"></div>

        <!-- Header / Navbar -->
        <header class="navbar">
            <div class="logo">
                <div class="logo-icon">✕</div>
                <span>LUGX</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#">Our Shop</a>
                <a href="#">Product Details</a>
                <a href="#">Contact Us</a>
                <a href="#" class="btn-signin">SIGN IN</a>
            </nav>
        </header>

        <!-- Main Content Area -->
        <div class="container">
            <!-- Left Text Content -->
            <div class="content-left">
                <span class="subtitle">WELCOME TO LUGX</span>
                <h1 class="main-title">
                    BEST <span class="highlight">GAMING<svg class="curve" viewBox="0 0 100 20"><path d="M0 10 Q 50 20 100 10" stroke="#ee626b" stroke-width="6" fill="none" stroke-linecap="round"/></svg></span> SITE EVER!
                </h1>
                <p class="description">
                    LUGX Gaming is free Bootstrap 5 HTML CSS website template for your gaming websites. 
                    You can download and use this layout for commercial purposes. Please tell your friends 
                    about TemplateMo.
                </p>
                
                <!-- Search Box -->
                <div class="search-box">
                    <input type="text" placeholder="Type Something">
                    <button type="submit">SEARCH NOW</button>
                </div>
            </div>

            <!-- Right Image Card with Badges -->
            <div class="content-right">
                <div class="card">
                    <span class="badge-price">$22</span>
                    <!-- अपनी इमेज का नाम/पाथ यहाँ लगाएं -->
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCbYjre2hDloDOxi4k2sgctpxyXAMQ16XjAwbFtR_C2Q&s=10" alt="">
                    <span class="badge-discount">-40%</span>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
